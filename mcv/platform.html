<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manchester Victoria | Live Departures</title>
<style>
@font-face {
  font-family: "Bunday Clean";
  src: url("bunday-clean-regular.woff") format("woff");
  font-weight: 400 600;
  font-style: normal;
}

@font-face {
  font-family: "Bunday Clean";
  src: url("bunday-clean-bold.woff") format("woff");
  font-weight: 700 900;
  font-style: normal;
}

:root {
  --navy:#262262;
  --blue:#0698d6;
  --bg:#f2f4f7;
  --panel:#ffffff;
  --line:#e1e5ec;
  --ink:#262262;
  --muted:#667085;
  --white:#ffffff;
  --green:#168653;
  --red:#c83c4b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bunday Clean", Arial, Helvetica, sans-serif}
header{
  background:#fff;
  border-bottom:1px solid #e4e7ed;
  padding:18px 4%;
  display:flex;justify-content:space-between;align-items:center;gap:20px;
  box-shadow:0 2px 10px rgba(38,34,98,.045)
}
.brand{display:flex;align-items:center;gap:26px;min-width:0}
.logo{width:190px;height:76px;object-fit:contain;display:block}
.station{border-left:1px solid #d9dce6;padding-left:24px}
h1{margin:0;color:var(--navy);font-size:clamp(23px,4vw,36px);line-height:1.1;font-weight:750;font-family:"Bunday Clean", Arial, Helvetica, sans-serif}
.subtitle{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:2.5px;margin-top:8px}
.clock{color:var(--navy);font-size:26px;font-weight:750;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-family:"Bunday Clean", Arial, Helvetica, sans-serif}
.clock small{display:block;color:var(--muted);font-size:11px;margin-top:5px;font-weight:500}
main{max-width:1500px;margin:auto;padding:27px 4%}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}
.heading{font-size:21px;font-weight:750;color:var(--navy);font-family:"Bunday Clean", Arial, Helvetica, sans-serif}
.live{color:var(--green);font-size:12px;margin-top:7px;font-weight:650}
.live:before{content:"";display:inline-block;width:8px;height:8px;background:var(--green);border-radius:50%;margin-right:8px;box-shadow:0 0 0 3px rgba(22,134,83,.12)}
button{background:var(--navy);color:#fff;border:0;border-radius:4px;padding:12px 17px;font-weight:700;font-family:"Bunday Clean", Arial, Helvetica, sans-serif;cursor:pointer;transition:background .15s ease}
button:hover{background:#36318a}
button:disabled{opacity:.55;cursor:wait}
.filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
input{background:#fff;border:1px solid #d4d9e3;color:var(--navy);padding:12px 14px;border-radius:4px;font-size:14px;flex:1;min-width:180px;outline:none;font-family:"Bunday Clean", Arial, Helvetica, sans-serif}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(6,152,214,.12)}
input::placeholder{color:#8791a2}
.board{background:var(--navy);border:1px solid #1e1a50;border-radius:6px;overflow:hidden;box-shadow:0 8px 24px rgba(38,34,98,.10)}
.labels,.service{display:grid;grid-template-columns:90px minmax(150px,1fr) 90px 115px 160px 35px;align-items:center;gap:12px;padding:16px 20px}
.labels{background:#1d1a50;color:#aeb8d6;font-size:10px;letter-spacing:1.1px;text-transform:uppercase;font-weight:750;font-family:"Bunday Clean", Arial, Helvetica, sans-serif}
.service{min-height:82px;border-top:1px solid rgba(255,255,255,.11);cursor:pointer;color:#fff;transition:background .15s ease}
.service:hover{background:#302b77}
.time{color:#fff;font-size:22px;font-weight:750;font-variant-numeric:tabular-nums;font-family:"Bunday Clean", Arial, Helvetica, sans-serif}
.destination{font-size:17px;font-weight:750;color:#fff;font-family:"Bunday Clean", Arial, Helvetica, sans-serif}
.operator{color:#bdc4db;font-size:12px;margin-top:6px}
.platform{background:rgba(6,152,214,.16);color:#79d5ff;border:1px solid rgba(6,152,214,.38);border-radius:4px;padding:8px;text-align:center;font-weight:750;font-family:"Bunday Clean", Arial, Helvetica, sans-serif}
.status{color:#8fe0b5;font-size:12px;font-weight:700;font-family:"Bunday Clean", Arial, Helvetica, sans-serif}
.delayed,.cancelled{color:#ff9ca5}.early{color:#8fe0b5}.boarding{color:#79d5ff}
.expand{color:#79d5ff;font-size:20px;text-align:center}
.route{display:none;background:#1d1a50;border-top:1px solid rgba(255,255,255,.12);padding:23px 30px 28px;color:#fff}
.route.open{display:block}
.route-title{color:#79d5ff;font-size:11px;letter-spacing:1.2px;font-weight:800;margin-bottom:20px;font-family:"Bunday Clean", Arial, Helvetica, sans-serif}
.stop{display:grid;grid-template-columns:22px 85px minmax(0,1fr) 85px;gap:12px;min-height:53px;position:relative;align-items:start}
.stop:not(:last-child):before{content:"";position:absolute;left:8px;top:14px;height:calc(100% + 1px);width:2px;background:#5d5a91}
.dot{width:18px;height:18px;border-radius:50%;border:3px solid var(--blue);background:#1d1a50;z-index:1}
.destination-stop .dot{background:var(--blue)}
.stop-name{font-weight:700;font-size:14px;color:#fff;font-family:"Bunday Clean", Arial, Helvetica, sans-serif}
.stop-time{color:#79d5ff;font-size:13px;font-variant-numeric:tabular-nums;font-family:"Bunday Clean", Arial, Helvetica, sans-serif}
.stop-platform{color:#bdc4db;font-size:12px;text-align:right}
.stop-sub{color:#aeb8d6;font-size:11px;margin-top:4px}
.route-error,.empty{padding:35px;text-align:center;color:#c5cbe0}
.footer{display:flex;justify-content:space-between;color:#747d90;font-size:12px;padding:16px 3px}
@media(max-width:700px){
 header{padding:15px 4%}.brand{gap:14px}.logo{width:112px;height:55px}.station{padding-left:14px}
 .subtitle{letter-spacing:1.5px;font-size:10px}.clock{font-size:19px}
 .labels{display:none}
 .service{grid-template-columns:65px 1fr 60px 25px;padding:15px 12px;gap:8px}
 .time{font-size:19px}.destination{font-size:15px}.platform{font-size:12px;padding:8px 3px}
 .service .expected{display:none}.status{grid-column:2/4}.expand{grid-column:4;grid-row:1}
 .route{padding:199px 12px}.stop{grid-template-columns:20px 70px 1fr 55px;gap:7px}
 .stop-name{font-size:12px}.stop-time,.stop-platform{font-size:11px}
 .footer{flex-direction:column;gap:8px}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="station">
      <h1 id="station-title">Manchester Victoria</h1>
      <div class="subtitle">LIVE DEPARTURES</div>
    </div>
  </div>
  <div class="clock" id="clock">--:--:--<small id="clock-date">Loading date...</small></div>
</header>

<main>
  <div class="toolbar">
    <div>
      <div class="heading">Live Train Times</div>
      <div class="live" id="live-indicator">Live Updates Active</div>
    </div>
    <button id="refresh-btn">Refresh Board</button>
  </div>

  <div class="filters">
    <input type="text" id="station-input" placeholder="Station Code or Name (e.g. MCV, MAN, Leeds)" value="MCV">
    <input type="text" id="filter-input" placeholder="Filter departures by destination or operator...">
  </div>

  <div class="board">
    <div class="labels">
      <div>Time</div>
      <div>Destination</div>
      <div>Platform</div>
      <div>Expected</div>
      <div>Status</div>
      <div></div>
    </div>
    <div id="board-body">
      <div class="empty">Loading departures data...</div>
    </div>
  </div>

  <div class="footer">
    <span id="update-time">Last updated: --:--:--</span>
    <span>Powered by National Rail Enquiries Open Data</span>
  </div>
</main>

<script>
const CONFIG = {
  STATION_CRS: 'MCV',
  API_URL: 'https://huxley2.azurewebsites.net/departures/',
  REFRESH_INTERVAL: 30000
};

let rawServices = [];
let openRouteRid = null;

function updateClock() {
  const now = new Date();
  document.getElementById('clock').innerHTML = `${now.toLocaleTimeString('en-GB')}<small id="clock-date">${now.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' })}</small>`;
}
setInterval(updateClock, 1000);
updateClock();

async function fetchDepartures() {
  const crs = document.getElementById('station-input').value.trim().toUpperCase() || CONFIG.STATION_CRS;
  const btn = document.getElementById('refresh-btn');
  btn.disabled = true;
  btn.textContent = 'Updating...';

  try {
    const res = await fetch(`${CONFIG.API_URL}${crs}?expand=true&accessToken=da1c7758-a82f-410e-8551-789a5015b67d`);
    if (!res.ok) throw new Error('Network error');
    const data = await res.json();
    
    document.getElementById('station-title').textContent = data.locationName || crs;
    rawServices = data.trainServices || [];
    renderServices();
    
    document.getElementById('update-time').textContent = `Last updated: ${new Date().toLocaleTimeString('en-GB')}`;
    document.getElementById('live-indicator').textContent = 'Live Updates Active';
    document.getElementById('live-indicator').style.color = 'var(--green)';
  } catch (err) {
    document.getElementById('board-body').innerHTML = `<div class="empty">Failed to load departure information. Please check station code and try again.</div>`;
    document.getElementById('live-indicator').textContent = 'Connection Error';
    document.getElementById('live-indicator').style.color = 'var(--red)';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Refresh Board';
  }
}

function renderServices() {
  const filter = document.getElementById('filter-input').value.toLowerCase();
  const container = document.getElementById('board-body');

  const filtered = rawServices.filter(s => {
    const dest = (s.destination?.[0]?.locationName || '').toLowerCase();
    const op = (s.operator || '').toLowerCase();
    return dest.includes(filter) || op.includes(filter);
  });

  if (!filtered.length) {
    container.innerHTML = `<div class="empty">${rawServices.length ? 'No matching services found.' : 'No scheduled departures at this time.'}</div>`;
    return;
  }

  container.innerHTML = filtered.map(s => {
    const dest = s.destination?.[0]?.locationName || 'Unknown Destination';
    const via = s.destination?.[0]?.via ? ` <small style="color:#bdc4db;font-weight:400">${s.destination[0].via}</small>` : '';
    const std = s.std || '--:--';
    const etd = s.etd || 'On time';
    const platform = s.platform || '-';
    const operator = s.operator || 'National Rail';
    const rid = s.serviceId || s.serviceID || s.rsid;

    let statusClass = 'status';
    if (etd === 'Cancelled') statusClass += ' cancelled';
    else if (etd === 'Delayed' || (etd !== 'On time' && etd !== 'Bus')) statusClass += ' delayed';
    else if (etd === 'On time') statusClass += ' early';

    const isOpen = openRouteRid === rid;

    // Render calling points if available inline via expanded API data
    let callingPointsHtml = '';
    const points = s.subsequentCallingPoints?.[0]?.callingPoint || [];
    if (points.length > 0) {
      callingPointsHtml = points.map((cp, idx) => `
        <div class="stop ${idx === points.length - 1 ? 'destination-stop' : ''}">
          <div class="dot"></div>
          <div class="stop-time">${cp.st || '--:--'}${cp.et && cp.et !== 'On time' ? `<div class="stop-sub">${cp.et}</div>` : ''}</div>
          <div>
            <div class="stop-name">${cp.locationName}</div>
          </div>
          <div class="stop-platform">${cp.platform ? 'Plat ' + cp.platform : ''}</div>
        </div>
      `).join('');
    } else {
      callingPointsHtml = `<div class="route-error">Calling point information unavailable for this service.</div>`;
    }

    return `
      <div>
        <div class="service" onclick="toggleRoute('${rid}')">
          <div class="time">${std}</div>
          <div>
            <div class="destination">${dest}${via}</div>
            <div class="operator">${operator}</div>
          </div>
          <div class="platform">${platform}</div>
          <div class="expected">${etd}</div>
          <div class="${statusClass}">${etd}</div>
          <div class="expand">${isOpen ? '▲' : '▼'}</div>
        </div>
        <div class="route ${isOpen ? 'open' : ''}" id="route-${rid}">
          <div class="route-title">CALLING POINTS</div>
          ${callingPointsHtml}
        </div>
      </div>
    `;
  }).join('');
}

function toggleRoute(rid) {
  openRouteRid = openRouteRid === rid ? null : rid;
  renderServices();
}

document.getElementById('refresh-btn').addEventListener('click', fetchDepartures);
document.getElementById('filter-input').addEventListener('input', renderServices);
document.getElementById('station-input').addEventListener('change', fetchDepartures);

fetchDepartures();
setInterval(fetchDepartures, CONFIG.REFRESH_INTERVAL);
</script>
</body>
</html>
