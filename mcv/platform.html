<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Departure Board | Manchester Victoria</title>
<style>
@font-face {
  font-family: "Bunday Clean";
  src: url("bunday-clean-regular.woff") format("woff");
  font-weight: 400 600;
  font-style: normal;
}
@font-face {
  font-family: "Bunday Clean";
  src: url("bunday-clean-bold.woff") format("woff");
  font-weight: 700 900;
  font-style: normal;
}
:root {
  --navy: #181545;
  --panel-navy: #100d32;
  --row-bg: #1a174a;
  --row-alt: #211e59;
  --blue: #0698d6;
  --light-blue: #79d5ff;
  --green: #23b772;
  --red: #ff5263;
  --amber: #ffbe3b;
  --text-white: #ffffff;
  --text-muted: #a4b0d0;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  width: 100vw; height: 100vh;
  overflow: hidden;
  background: #0b0924;
  color: var(--text-white);
  font-family: "Bunday Clean", Arial, Helvetica, sans-serif;
  user-select: none;
}
.screen-container {
  display: flex; flex-direction: column;
  height: 100vh; width: 100vw;
  background: radial-gradient(circle at 50% 0%, #1d1952 0%, #09071f 100%);
}
header {
  background: var(--navy);
  border-bottom: 3px solid var(--blue);
  padding: 0.8rem 2.5rem;
  display: flex; justify-content: space-between; align-items: center;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  z-index: 10;
}
.brand { display: flex; align-items: center; gap: 2rem; }
.logo { height: 48px; width: auto; object-fit: contain; }
.station-info {
  border-left: 2px solid rgba(255, 255, 255, 0.2);
  padding-left: 1.8rem;
}
h1 {
  margin: 0; font-size: clamp(24px, 2.8vw, 36px);
  font-weight: 800; letter-spacing: 0.5px;
  color: var(--text-white); text-transform: uppercase;
}
.platform-indicator { display: flex; align-items: center; gap: 12px; margin-top: 2px; }
.subtitle {
  color: var(--light-blue); font-size: 13px;
  font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
}
.clock-container { text-align: right; }
.clock {
  font-size: clamp(32px, 3.5vw, 48px);
  font-weight: 800; font-variant-numeric: tabular-nums;
  line-height: 1; color: #ffffff; text-shadow: none;
}
.clock-date {
  color: var(--text-muted); font-size: 13px;
  font-weight: 600; margin-top: 4px; text-transform: uppercase; letter-spacing: 1px;
}
main {
  flex: 1; min-height: 0; display: flex; flex-direction: column;
  padding: 1.2rem 2.5rem; gap: 1rem; overflow: hidden;
}
.board-container {
  flex: 1; background: var(--panel-navy);
  border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px;
  display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}
.board-header {
  display: grid; grid-template-columns: 100px 1fr 180px 180px 100px; gap: 1.5rem;
  padding: 0.9rem 2rem; background: #0a0826;
  border-bottom: 2px solid rgba(255, 255, 255, 0.1);
  color: var(--text-muted); font-size: 13px; font-weight: 800;
  letter-spacing: 1.5px; text-transform: uppercase;
}
/* The list scrolls itself; hide manual scrollbars on platform displays. */
.board-rows {
  flex: 1; min-height: 0; display: flex; flex-direction: column;
  justify-content: flex-start; overflow-y: auto; overscroll-behavior: contain;
  scrollbar-width: none;
}
.board-rows::-webkit-scrollbar { display: none; }
.service-card {
  display: flex; flex-direction: column; padding: 0.85rem 2rem;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06); justify-content: center;
  flex: 0 0 auto;
}
.service-card:nth-child(even) { background: rgba(255, 255, 255, 0.02); }
.service-main {
  display: grid; grid-template-columns: 100px 1fr 180px 180px 100px; gap: 1.5rem; align-items: center;
}
.dep-time { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; color: #fff; }
.dep-dest { font-size: 22px; font-weight: 800; color: #fff; }
.dep-operator { color: var(--text-muted); font-size: 15px; font-weight: 600; }
.dep-status { font-size: 18px; font-weight: 800; }
.dep-plat {
  text-align: center; font-weight: 900; font-size: 22px; color: var(--light-blue);
  background: rgba(6, 152, 214, 0.15); border: 1px solid rgba(6, 152, 214, 0.3);
  border-radius: 6px; padding: 4px 8px;
}
/* Fixed CALLING AT label; long calling-point strings travel across the available width. */
.service-stops {
  margin-top: 4px; margin-left: calc(100px + 1.5rem); padding: 2px 0 5px;
  display: flex; gap: 6px; min-width: 0; max-width: calc(100% - 100px - 1.5rem);
  color: var(--text-muted); font-size: 14px; font-weight: 600; white-space: nowrap;
}
.service-stops .label {
  flex: none; color: var(--light-blue); font-weight: 700; text-transform: uppercase;
  font-size: 12px; letter-spacing: 0.5px;
}
.stops-viewport {
  flex: 1; min-width: 0; overflow-x: auto; overflow-y: hidden;
  scrollbar-width: none;
}
.stops-viewport::-webkit-scrollbar { display: none; }
.stops-text { display: inline-block; white-space: nowrap; }
.on-time { color: var(--green); }
.delayed, .cancelled { color: var(--red); }
footer {
  background: #07051a; border-top: 1px solid rgba(255, 255, 255, 0.1);
  padding: 0.8rem 2.5rem; display: flex; align-items: center; gap: 1.5rem; font-size: 15px;
}
.ticker-label {
  background: var(--blue); color: #fff; font-weight: 800; font-size: 12px;
  padding: 4px 10px; border-radius: 3px; letter-spacing: 1px; white-space: nowrap;
}
.ticker-content { flex: 1; overflow: hidden; white-space: nowrap; color: var(--text-muted); font-weight: 600; }
.ticker-text { display: inline-block; padding-left: 100%; animation: ticker 30s linear infinite; }
@keyframes ticker { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }
</style>
</head>
<body>

<div class="screen-container">
  <header>
    <div class="brand">
      <img class="logo" src="794815740-Northern-Logo-Reversed---PNG-1--1---002-.png" alt="Northern Logo" onerror="this.style.display='none'">
      <div class="station-info">
        <h1>Manchester Victoria</h1>
        <div class="platform-indicator">
          <span class="subtitle">Live Platforms 1 – 6 Departures</span>
        </div>
      </div>
    </div>
    <div class="clock-container">
      <div class="clock" id="live-clock">--:--:--</div>
      <div class="clock-date" id="live-date">--</div>
    </div>
  </header>

  <main>
    <section class="board-container">
      <div class="board-header">
        <div>Time</div>
        <div>Destination</div>
        <div>Operator</div>
        <div>Status</div>
        <div style="text-align: center;">Platform</div>
      </div>
      <div class="board-rows" id="board-rows">
        <div style="padding: 2.5rem; text-align: center; color: var(--text-muted); font-weight: bold; font-size: 18px;">
          Connecting to live rail feeds...
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="ticker-label">SERVICE UPDATE</div>
    <div class="ticker-content">
      <div class="ticker-text" id="ticker-text">
        Welcome to Manchester Victoria. Please check platform screens for gate changes and listen for station announcements.
      </div>
    </div>
  </footer>
</div>

<script>
const CONFIG = {
  allowedPlatforms: ['1', '2', '3', '4', '5', '6'],
  refreshIntervalMs: 30000,
  endpoints: [
    'https://api.traini.ac/api/departures/MCV?limit=30' // Traini live departures API
  ]
};

function updateClock() {
  const now = new Date();
  document.getElementById('live-clock').textContent = now.toLocaleTimeString('en-GB', { hour12: false });
  document.getElementById('live-date').textContent = now.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}

function formatTrainiTime(value) {
  if (value === null || value === undefined || value === '') return '--:--';
  const d = new Date(value);
  if (!Number.isNaN(d.getTime())) return d.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit', timeZone:'Europe/London'});
  return String(value);
}

function parseServices(data) {
  const services = Array.isArray(data) ? data : (data && Array.isArray(data.results) ? data.results : []);
  return services.map(s => {
    const destination = s.destination?.name || s.destination_name || s.destinationName || 'Unknown';
    const rawStatus = String(s.status_text || s.status || 'On time');
    const lower = rawStatus.toLowerCase();
    let statusText = rawStatus;
    let statusClass = 'on-time';
    if (lower.includes('cancel')) { statusText = 'Cancelled'; statusClass = 'cancelled'; }
    else if (lower.includes('late') || lower.includes('delay')) { statusText = rawStatus.replaceAll('_',' '); statusClass = 'delayed'; }
    else if (lower.includes('boarding')) { statusText = 'Boarding'; statusClass = 'on-time'; }
    else if (lower === 'expected_early') { statusText = 'Early'; }
    else if (lower === 'on_time' || lower === 'on time') { statusText = 'On time'; }
    const points = Array.isArray(s.calling_points) ? s.calling_points : [];
    const victoriaIndex = points.findIndex(p => (p.station?.crs || p.crs || '').toUpperCase() === 'MCV' || (p.station?.name || p.name || '').toLowerCase() === 'manchester victoria');
    const onward = victoriaIndex >= 0 ? points.slice(victoriaIndex + 1) : points.filter(p => (p.station?.crs || p.crs || '').toUpperCase() !== 'MCV');
    const stops = onward.map(p => p.station?.name || p.name || p.station?.crs || p.crs).filter(Boolean).join(', ');
    return {
      time: formatTrainiTime(s.departs),
      destination,
      operator: s.operator || 'National Rail',
      status: statusText,
      statusClass,
      platform: String(s.platform || '').trim(),
      stops
    };
  });
}

// Simulated data fallback if all APIs are blocked by CORS/downtime
function getFallbackMockData() {
  const now = new Date();
  const t = (minOffset) => {
    let d = new Date(now.getTime() + minOffset * 60000);
    return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
  };
  return [
    { time: t(2), destination: 'Leeds', operator: 'TransPennine Express', status: 'On time', statusClass: 'on-time', platform: '1', stops: 'Stalybridge, Huddersfield, Dewsbury, Leeds' },
    { time: t(5), destination: 'Blackburn', operator: 'Northern', status: 'On time', statusClass: 'on-time', platform: '4', stops: 'Salford Crescent, Bolton, Darwen, Blackburn' },
    { time: t(12), destination: 'Liverpool Lime Street', operator: 'Northern', status: 'Delayed', statusClass: 'delayed', platform: '3', stops: 'Newton-le-Willows, St Helens Central, Liverpool Lime Street' },
    { time: t(18), destination: 'Clitheroe', operator: 'Northern', status: 'On time', statusClass: 'on-time', platform: '5', stops: 'Bolton, Blackburn, Whalley, Clitheroe' },
    { time: t(25), destination: 'Manchester Airport', operator: 'TransPennine Express', status: 'Cancelled', statusClass: 'cancelled', platform: '2', stops: 'Oxford Road, Piccadilly, Manchester Airport' }
  ];
}

async function fetchDepartures() {
  let successData = null;
  
  for (const url of CONFIG.endpoints) {
    try {
      const response = await fetch(url, { cache: 'no-store' });
      if (response.ok) {
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || data.error || `HTTP ${response.status}`);
        const parsed = parseServices(data);
        if (parsed.length > 0) {
          successData = parsed;
          document.getElementById('ticker-text').textContent = `Live data connected via ${new URL(url).hostname} - Please check screens for latest updates.`;
          break; // Stop at first successful API
        }
      }
    } catch (e) {
      console.warn(`Failed to fetch from ${url}:`, e);
    }
  }

  // If the API fails or is blocked by browser CORS, show clearly-labelled demo data
  if (!successData) {
    console.warn("All live endpoints failed. Using local fallback data.");
    successData = getFallbackMockData();
    document.getElementById('ticker-text').textContent = "⚠️ Network offline or APIs unreachable. Showing simulated fallback timetable.";
  }

  const filtered = successData.filter(s => {
    if (!s.platform) return true;
    return CONFIG.allowedPlatforms.includes(s.platform);
  });

  renderBoard(filtered.length > 0 ? filtered : successData);
}

// Platform display movement; change these numbers to adjust the pace.
const MOTION = {
  verticalPixelsPerSecond: 23,
  pauseAtTopMs: 5000,
  pauseAtBottomMs: 5500,
  callingPointsPixelsPerSecond: 40,
  callingPointsStartPauseMs: 2000,
  callingPointsEndPauseMs: 2500
};

const boardRows = document.getElementById('board-rows');
let stopViewports = [];
const stopStates = new Map();
let verticalPhase = 'top';
let verticalWaitUntil = performance.now() + MOTION.pauseAtTopMs;
let previousAnimationTime = null;

function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, character => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[character]));
}

function renderBoard(services) {
  // A live refresh must not throw the display back to the first departure.
  const previousPosition = boardRows.scrollTop;
  const previousStops = new Map();
  for (const viewport of stopViewports) {
    const key = viewport.closest('.service-card')?.dataset.serviceKey;
    if (key) previousStops.set(key, viewport.scrollLeft);
  }

  boardRows.innerHTML = '';
  const currentKeys = new Set();
  // Display all live departures, not just the first six.
  services.forEach((dep, index) => {
    const card = document.createElement('div');
    card.className = 'service-card';
    const key = [dep.time, dep.destination, dep.operator].join('|');
    const uniqueKey = currentKeys.has(key) ? key + '|' + index : key;
    currentKeys.add(uniqueKey);
    card.dataset.serviceKey = uniqueKey;
    card.innerHTML = `
      <div class="service-main">
        <div class="dep-time">${escapeHTML(dep.time)}</div>
        <div class="dep-dest">${escapeHTML(dep.destination)}</div>
        <div class="dep-operator">${escapeHTML(dep.operator)}</div>
        <div class="dep-status ${['on-time', 'delayed', 'cancelled'].includes(dep.statusClass) ? dep.statusClass : 'on-time'}">${escapeHTML(dep.status)}</div>
        <div class="dep-plat">${escapeHTML(dep.platform || 'TBC')}</div>
      </div>
      <div class="service-stops">
        <span class="label">Calling at:</span>
        <div class="stops-viewport"><span class="stops-text">${escapeHTML(dep.stops || 'Direct service')}</span></div>
      </div>
    `;
    boardRows.appendChild(card);
    const viewport = card.querySelector('.stops-viewport');
    if (previousStops.has(uniqueKey)) viewport.scrollLeft = previousStops.get(uniqueKey);
  });
  stopViewports = [...boardRows.querySelectorAll('.stops-viewport')];
  // Keep the vertical scroll in the same place when the 30-second data refresh occurs.
  boardRows.scrollTop = Math.min(previousPosition, Math.max(0, boardRows.scrollHeight - boardRows.clientHeight));
  for (const key of stopStates.keys()) if (!currentKeys.has(key)) stopStates.delete(key);
}

// Animate with elapsed time rather than frame count, so it behaves at 30/60/120 Hz.
function autoScrollFrame(now) {
  const elapsed = previousAnimationTime === null ? 0 : Math.min((now - previousAnimationTime) / 1000, 0.1);
  previousAnimationTime = now;
  const bottom = Math.max(0, boardRows.scrollHeight - boardRows.clientHeight);

  if (bottom > 1) {
    if (verticalPhase === 'top' && now >= verticalWaitUntil) {
      verticalPhase = 'down';
    }
    if (verticalPhase === 'down') {
      boardRows.scrollTop = Math.min(bottom, boardRows.scrollTop + MOTION.verticalPixelsPerSecond * elapsed);
      if (boardRows.scrollTop >= bottom - 1) {
        boardRows.scrollTop = bottom;
        verticalPhase = 'bottom';
        verticalWaitUntil = now + MOTION.pauseAtBottomMs;
      }
    } else if (verticalPhase === 'bottom' && now >= verticalWaitUntil) {
      boardRows.scrollTop = 0;
      verticalPhase = 'top';
      verticalWaitUntil = now + MOTION.pauseAtTopMs;
    }
  } else {
    boardRows.scrollTop = 0;
    verticalPhase = 'top';
    verticalWaitUntil = now + MOTION.pauseAtTopMs;
  }

  // Each long list of stops scrolls horizontally, independently and automatically.
  // Hidden rows are paused until they appear on screen to make stops easier to read.
  const visibleArea = boardRows.getBoundingClientRect();
  for (const viewport of stopViewports) {
    const excess = viewport.scrollWidth - viewport.clientWidth;
    if (excess <= 1) continue;
    const rowRect = viewport.closest('.service-card').getBoundingClientRect();
    if (rowRect.bottom <= visibleArea.top || rowRect.top >= visibleArea.bottom) continue;

    const key = viewport.closest('.service-card').dataset.serviceKey;
    let state = stopStates.get(key);
    if (!state) {
      state = { phase: 'start', waitUntil: now + MOTION.callingPointsStartPauseMs };
      stopStates.set(key, state);
    }
    if (now < state.waitUntil) continue;
    if (state.phase === 'start') state.phase = 'moving';
    if (state.phase === 'moving') {
      viewport.scrollLeft = Math.min(excess, viewport.scrollLeft + MOTION.callingPointsPixelsPerSecond * elapsed);
      if (viewport.scrollLeft >= excess - 1) {
        viewport.scrollLeft = excess;
        state.phase = 'end';
        state.waitUntil = now + MOTION.callingPointsEndPauseMs;
      }
    } else if (state.phase === 'end') {
      viewport.scrollLeft = 0;
      state.phase = 'start';
      state.waitUntil = now + MOTION.callingPointsStartPauseMs;
    }
  }
  requestAnimationFrame(autoScrollFrame);
}
requestAnimationFrame(autoScrollFrame);

setInterval(updateClock, 1000);
updateClock();

fetchDepartures();
setInterval(fetchDepartures, CONFIG.refreshIntervalMs);
</script>

</body>
</html>
