<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Departure Board | Manchester Victoria</title>
<style>
@font-face {
  font-family: "Bunday Clean";
  src: url("bunday-clean-regular.woff") format("woff");
  font-weight: 400 600;
  font-style: normal;
}

@font-face {
  font-family: "Bunday Clean";
  src: url("bunday-clean-bold.woff") format("woff");
  font-weight: 700 900;
  font-style: normal;
}

:root {
  --navy: #181545;
  --panel-navy: #100d32;
  --row-bg: #1a174a;
  --row-alt: #211e59;
  --blue: #0698d6;
  --light-blue: #79d5ff;
  --green: #23b772;
  --red: #ff5263;
  --amber: #ffbe3b;
  --text-white: #ffffff;
  --text-muted: #a4b0d0;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #0b0924;
  color: var(--text-white);
  font-family: "Bunday Clean", Arial, Helvetica, sans-serif;
  user-select: none;
}

/* Screen Layout */
.screen-container {
  display: flex;
  flex-direction: column;
  height: 100vh;
  width: 100vw;
  background: radial-gradient(circle at 50% 0%, #1d1952 0%, #09071f 100%);
}

/* Header Display */
header {
  background: var(--navy);
  border-bottom: 3px solid var(--blue);
  padding: 0.8rem 2.5rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  z-index: 10;
}

.brand {
  display: flex;
  align-items: center;
  gap: 2rem;
}

.logo {
  height: 48px;
  width: auto;
  object-fit: contain;
}

.station-info {
  border-left: 2px solid rgba(255, 255, 255, 0.2);
  padding-left: 1.8rem;
}

h1 {
  margin: 0;
  font-size: clamp(24px, 2.8vw, 36px);
  font-weight: 800;
  letter-spacing: 0.5px;
  color: var(--text-white);
  text-transform: uppercase;
}

.platform-indicator {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 2px;
}

.subtitle {
  color: var(--light-blue);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.clock-container {
  text-align: right;
}

.clock {
  font-size: clamp(32px, 3.5vw, 48px);
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  color: #ffffff;
  text-shadow: none;
}

.clock-date {
  color: var(--text-muted);
  font-size: 13px;
  font-weight: 600;
  margin-top: 4px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* Main Content Area */
main {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 1.2rem 2.5rem;
  gap: 1rem;
  overflow: hidden;
}

/* Departures Board */
.board-container {
  flex: 1;
  background: var(--panel-navy);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}

.board-header {
  display: grid;
  grid-template-columns: 100px 1fr 180px 180px 100px;
  gap: 1.5rem;
  padding: 0.9rem 2rem;
  background: #0a0826;
  border-bottom: 2px solid rgba(255, 255, 255, 0.1);
  color: var(--text-muted);
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

.board-rows {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
}

.service-card {
  display: flex;
  flex-direction: column;
  padding: 0.85rem 2rem;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  justify-content: center;
}

.service-card:nth-child(even) {
  background: rgba(255, 255, 255, 0.02);
}

.service-main {
  display: grid;
  grid-template-columns: 100px 1fr 180px 180px 100px;
  gap: 1.5rem;
  align-items: center;
}

.dep-time {
  font-size: 26px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  color: #fff;
}

.dep-dest {
  font-size: 22px;
  font-weight: 800;
  color: #fff;
}

.dep-operator {
  color: var(--text-muted);
  font-size: 15px;
  font-weight: 600;
}

.dep-status {
  font-size: 18px;
  font-weight: 800;
}

.dep-plat {
  text-align: center;
  font-weight: 900;
  font-size: 22px;
  color: var(--light-blue);
  background: rgba(6, 152, 214, 0.15);
  border: 1px solid rgba(6, 152, 214, 0.3);
  border-radius: 6px;
  padding: 4px 8px;
}

/* Intermediate Stops Row */
.service-stops {
  margin-top: 4px;
  padding-left: 100px;
  font-size: 14px;
  color: var(--text-muted);
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.service-stops .label {
  color: var(--light-blue);
  font-weight: 700;
  text-transform: uppercase;
  font-size: 12px;
  letter-spacing: 0.5px;
  margin-right: 6px;
}

/* Status Colors */
.on-time { color: var(--green); }
.delayed, .cancelled { color: var(--red); }

/* Footer Ticker / Information Bar */
footer {
  background: #07051a;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
  padding: 0.8rem 2.5rem;
  display: flex;
  align-items: center;
  gap: 1.5rem;
  font-size: 15px;
}

.ticker-label {
  background: var(--blue);
  color: #fff;
  font-weight: 800;
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 3px;
  letter-spacing: 1px;
  white-space: nowrap;
}

.ticker-content {
  flex: 1;
  overflow: hidden;
  white-space: nowrap;
  color: var(--text-muted);
  font-weight: 600;
}

.ticker-text {
  display: inline-block;
  padding-left: 100%;
  animation: ticker 30s linear infinite;
}

@keyframes ticker {
  0% { transform: translate3d(0, 0, 0); }
  100% { transform: translate3d(-100%, 0, 0); }
}
</style>
</head>
<body>

<div class="screen-container">
  <header>
    <div class="brand">
      <img class="logo" src="794815740-Northern-Logo-Reversed---PNG-1--1---002-.png" alt="Northern Logo">
      <div class="station-info">
        <h1>Manchester Victoria</h1>
        <div class="platform-indicator">
          <span class="subtitle">Live Platforms 1 – 6 Departures</span>
        </div>
      </div>
    </div>
    <div class="clock-container">
      <div class="clock" id="live-clock">--:--:--</div>
      <div class="clock-date" id="live-date">--</div>
    </div>
  </header>

  <main>
    <section class="board-container">
      <div class="board-header">
        <div>Time</div>
        <div>Destination</div>
        <div>Operator</div>
        <div>Status</div>
        <div style="text-align: center;">Platform</div>
      </div>
      <div class="board-rows" id="board-rows">
        <!-- Live Departures Rendered Here -->
      </div>
    </section>
  </main>

  <footer>
    <div class="ticker-label">SERVICE UPDATE</div>
    <div class="ticker-content">
      <div class="ticker-text" id="ticker-text">
        Welcome to Manchester Victoria. Please check platform screens for gate changes and listen for station announcements.
      </div>
    </div>
  </footer>
</div>

<script>
const CONFIG = {
  platforms: ['1', '2', '3', '4', '5', '6'],
  apiEndpoint: 'https://api.traini.ac/api/departures/MCV?limit=30',
  refreshIntervalMs: 20000
};

function updateClock() {
  const now = new Date();
  const hours = String(now.getHours()).padStart(2, '0');
  const minutes = String(now.getMinutes()).padStart(2, '0');
  const seconds = String(now.getSeconds()).padStart(2, '0');
  document.getElementById('live-clock').textContent = `${hours}:${minutes}:${seconds}`;
  
  const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
  document.getElementById('live-date').textContent = now.toLocaleDateString('en-GB', options);
}

function extractValue(obj, paths) {
  if (!obj) return null;
  for (let path of paths) {
    let current = obj;
    let parts = path.split('.');
    let found = true;
    for (let p of parts) {
      if (current && current[p] !== undefined && current[p] !== null) {
        current = current[p];
      } else {
        found = false;
        break;
      }
    }
    if (found && current !== null && current !== undefined) return current;
  }
  return null;
}

function parseResponseData(data) {
  let rawServices = [];
  
  if (Array.isArray(data)) {
    rawServices = data;
  } else if (data && typeof data === 'object') {
    rawServices = data.departures || data.trainServices || data.services || data.data || data.trains || [];
  }

  if (!Array.isArray(rawServices)) return [];

  const formatted = [];

  for (let s of rawServices) {
    // Platform extraction
    const platVal = String(extractValue(s, ['platform', 'plat', 'platformNumber']) || '').trim();
    if (CONFIG.platforms.length > 0 && platVal && !CONFIG.platforms.includes(platVal)) {
      continue;
    }

    // Departure Time
    const timeVal = extractValue(s, ['std', 'time', 'scheduledDepartureTime', 'scheduledDeparture', 'departureTime', 'aimedDepartureTime']) || '--:--';

    // Destination
    let destVal = 'Unknown Destination';
    const rawDest = extractValue(s, ['destination', 'dest', 'locationName']);
    if (typeof rawDest === 'string') {
      destVal = rawDest;
    } else if (Array.isArray(rawDest) && rawDest.length > 0) {
      destVal = rawDest[0].locationName || rawDest[0].name || rawDest[0].crs || 'Unknown';
    } else if (rawDest && typeof rawDest === 'object') {
      destVal = rawDest.locationName || rawDest.name || 'Unknown';
    }

    // Operator
    let opVal = extractValue(s, ['operator', 'toc', 'operatorName', 'serviceProvider']) || 'Northern';
    if (typeof opVal === 'object') opVal = opVal.name || opVal.code || 'Northern';

    // Status mapping: strictly "On time", "Delayed", or "Cancelled"
    let rawStatus = String(extractValue(s, ['etd', 'status', 'expectedDepartureTime', 'realtimeStatus']) || 'On time').trim();
    let statusText = 'On time';
    let statusClass = 'on-time';

    const lowerStatus = rawStatus.toLowerCase();
    if (lowerStatus.includes('cancel')) {
      statusText = 'Cancelled';
      statusClass = 'cancelled';
    } else if (lowerStatus.includes('delay') || lowerStatus.includes('late') || (rawStatus.includes(':') && rawStatus !== timeVal)) {
      statusText = 'Delayed';
      statusClass = 'delayed';
    } else {
      statusText = 'On time';
      statusClass = 'on-time';
    }

    // Calling points / Stops
    let stopsList = [];
    const rawStops = extractValue(s, ['callingPoints', 'subsequentCallingPoints', 'stops', 'callingPointsList']);
    
    if (Array.isArray(rawStops)) {
      if (rawStops.length > 0 && rawStops[0].callingPoint) {
        stopsList = rawStops[0].callingPoint.map(cp => cp.locationName || cp.name);
      } else {
        stopsList = rawStops.map(cp => typeof cp === 'string' ? cp : (cp.locationName || cp.name || cp.stationName));
      }
    }

    formatted.push({
      time: timeVal,
      destination: destVal,
      operator: opVal,
      status: statusText,
      statusClass: statusClass,
      platform: platVal || 'TBC',
      stops: stopsList.length > 0 ? stopsList.filter(Boolean).join(', ') : 'Direct Service'
    });
  }

  return formatted;
}

async function fetchDepartures() {
  try {
    const response = await fetch(CONFIG.apiEndpoint);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    
    const data = await response.json();
    const services = parseResponseData(data);
    
    renderBoard(services);
  } catch (err) {
    console.error('API Fetch Error:', err);
    // Display helpful message on screen if API call fails due to network/CORS issues
    const boardRows = document.getElementById('board-rows');
    if (boardRows.children.length === 0) {
      boardRows.innerHTML = `<div style="padding: 2rem; text-align: center; color: var(--red); font-weight: bold;">Unable to connect to departure API: ${err.message}</div>`;
    }
  }
}

function renderBoard(services) {
  const boardRows = document.getElementById('board-rows');
  boardRows.innerHTML = '';

  if (!services || services.length === 0) {
    boardRows.innerHTML = `<div style="padding: 2rem; text-align: center; color: var(--text-muted); font-weight: bold;">No departures currently scheduled for Platforms 1–6.</div>`;
    return;
  }

  const displayList = services.slice(0, 6);

  displayList.forEach(dep => {
    const card = document.createElement('div');
    card.className = 'service-card';
    card.innerHTML = `
      <div class="service-main">
        <div class="dep-time">${dep.time}</div>
        <div class="dep-dest">${dep.destination}</div>
        <div class="dep-operator">${dep.operator}</div>
        <div class="dep-status ${dep.statusClass}">${dep.status}</div>
        <div class="dep-plat">${dep.platform}</div>
      </div>
      <div class="service-stops">
        <span class="label">Calling at:</span>${dep.stops}
      </div>
    `;
    boardRows.appendChild(card);
  });
}

setInterval(updateClock, 1000);
updateClock();

fetchDepartures();
setInterval(fetchDepartures, CONFIG.refreshIntervalMs);
</script>

</body>
</html>
