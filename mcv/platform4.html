<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manchester Victoria | Platform 4 Departures — Northern</title>
<style>
@font-face {
  font-family: "Bunday Clean";
  src: url("bunday-clean-regular.woff") format("woff");
  font-weight: 400 600;
  font-style: normal;
}
@font-face {
  font-family: "Bunday Clean";
  src: url("bunday-clean-bold.woff") format("woff");
  font-weight: 700 900;
  font-style: normal;
}
/* Northern Brand Book (Sept 2022), pp. 10–11. */
:root {
  --navy: #262262;
  --panel-navy: #262262;
  --row-bg: #262262;
  --row-alt: #262262;
  --blue: #0698d6;
  --brand-grey: #7b868c;
  --text-white: #ffffff;
  --text-muted: rgba(255,255,255,0.92);
  --green: #007a33;   /* accessible dark green from the brand's green range */
  --red: #eb0040;
  --amber: #ffbd1c;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  width: 100vw; height: 100vh;
  overflow: hidden;
  background: var(--navy);
  color: var(--text-white);
  font-family: "Bunday Clean", Arial, Helvetica, sans-serif;
  user-select: none;
}
.screen-container {
  display: flex; flex-direction: column;
  height: 100vh; width: 100vw;
  background: var(--navy);
}
header {
  background: #ffffff;
  border-bottom: 4px solid var(--blue);
  padding: 0.8rem 2.5rem;
  display: flex; justify-content: space-between; align-items: center;
  box-shadow: none;
  z-index: 10;
}
.brand { display: flex; align-items: center; gap: 2rem; }
.logo { height: 48px; width: auto; object-fit: contain; }
.station-info {
  border-left: 2px solid rgba(38, 34, 98, 0.2);
  padding-left: 1.8rem;
}
h1 {
  margin: 0; font-size: clamp(24px, 2.8vw, 36px);
  font-weight: 800; letter-spacing: 0.5px;
  color: var(--navy); text-transform: uppercase;
}
.platform-indicator { display: flex; align-items: center; gap: 12px; margin-top: 2px; }
.subtitle {
  color: var(--navy); font-size: 13px;
  font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
}
.clock-container { text-align: right; }
.clock {
  font-size: clamp(32px, 3.5vw, 48px);
  font-weight: 800; font-variant-numeric: tabular-nums;
  line-height: 1; color: var(--navy); text-shadow: none;
}
.clock-date {
  color: var(--navy); font-size: 13px;
  font-weight: 600; margin-top: 4px; text-transform: uppercase; letter-spacing: 1px;
}
main {
  flex: 1; min-height: 0; display: flex; flex-direction: column;
  padding: 1.2rem 2.5rem; gap: 1rem; overflow: hidden;
}
.board-container {
  flex: 1; background: var(--panel-navy);
  border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 8px;
  display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  box-shadow: none;
}
.board-header {
  display: grid; grid-template-columns: 100px 1fr 180px 180px 100px; gap: 1.5rem;
  padding: 0.9rem 2rem; background: var(--navy);
  border-bottom: 2px solid var(--blue);
  color: var(--text-muted); font-size: 13px; font-weight: 800;
  letter-spacing: 1.5px; text-transform: uppercase;
}
/* The list scrolls itself; hide manual scrollbars on platform displays. */
.board-rows {
  flex: 1; min-height: 0; display: flex; flex-direction: column;
  justify-content: flex-start; overflow-y: auto; overscroll-behavior: contain;
  scrollbar-width: none;
}
.board-rows::-webkit-scrollbar { display: none; }
.service-card {
  display: flex; flex-direction: column; padding: 0.85rem 2rem;
  border-bottom: 1px solid rgba(255, 255, 255, 0.2); justify-content: center;
  flex: 0 0 auto;
}
.service-card:nth-child(even) { background: rgba(255, 255, 255, 0.055); }
.service-main {
  display: grid; grid-template-columns: 100px 1fr 180px 180px 100px; gap: 1.5rem; align-items: center;
}
.dep-time { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; color: #fff; }
.dep-dest { font-size: 22px; font-weight: 800; color: #fff; text-transform: uppercase; }
.dep-operator { color: #ffffff; font-size: 15px; font-weight: 600; }
.dep-status { font-size: 18px; font-weight: 800; }
.dep-plat {
  text-align: center; font-weight: 900; font-size: 22px; color: var(--navy);
  background: var(--blue); border: 1px solid var(--blue);
  border-radius: 6px; padding: 4px 8px;
}
/* Fixed CALLING AT label; long calling-point strings travel across the available width. */
.service-stops {
  margin-top: 4px; margin-left: calc(100px + 1.5rem); padding: 2px 0 5px;
  display: flex; gap: 6px; min-width: 0; max-width: calc(100% - 100px - 1.5rem);
  color: var(--text-muted); font-size: 14px; font-weight: 600; white-space: nowrap;
}
.service-stops .label {
  flex: none; color: #ffffff; font-weight: 700; text-transform: uppercase;
  font-size: 12px; letter-spacing: 0.5px;
}
.stops-viewport {
  flex: 1; min-width: 0; overflow-x: auto; overflow-y: hidden;
  scrollbar-width: none;
}
.stops-viewport::-webkit-scrollbar { display: none; }
.stops-text { display: inline-block; white-space: nowrap; text-transform: uppercase; }
.service-reason {
  margin: 6px 0 0 calc(100px + 1.5rem);
  color: #ffffff; font-size: 14px; font-weight: 600;
  white-space: normal; overflow-wrap: anywhere; line-height: 1.35;
}
.service-reason .label {
  font-size: 12px; font-weight: 800; letter-spacing: .35px;
  margin-right: 6px;
}
/* Carriage positioning instruction remains visible on the actual service row,
   independently of the rotating alert ticker and stopping-pattern marquee. */
.carriage-notice {
  margin: 7px 0 3px calc(100px + 1.5rem);
  padding: 7px 11px;
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px;
  border-left: 5px solid var(--blue); border-radius: 4px;
  background: var(--amber); color: var(--navy);
  font-size: 15px; font-weight: 600; line-height: 1.4;
}
.carriage-notice-label {
  font-size: 12px; font-weight: 900; letter-spacing: 0.75px;
  text-transform: uppercase;
}
.carriage-notice-copy strong { font-weight: 900; }
/* Northern contrast-safe combinations: white/dark green, navy/yellow, white/red. */
.dep-status {
  display: inline-block;
  width: fit-content;
  max-width: 100%;
  padding: 6px 9px;
  border-radius: 4px;
  font-size: 16px;
  line-height: 1.22;
  overflow-wrap: anywhere;
}
.on-time { background: var(--green); color: #ffffff; }
.delayed { background: var(--amber); color: var(--navy); }
.cancelled { background: var(--red); color: #ffffff; }
footer {
  background: var(--navy); border-top: 2px solid var(--blue);
  padding: 0.8rem 2.5rem; display: flex; align-items: center; gap: 1.5rem; font-size: 15px;
}
.ticker-label {
  background: var(--navy); color: #fff; border-left: 4px solid var(--blue); font-weight: 800; font-size: 12px;
  padding: 4px 10px; border-radius: 3px; letter-spacing: 1px; white-space: nowrap;
}
/* Rotate one verified, relevant service alert at a time: no crawling text that
   passengers must chase or a 30-second empty gap before each announcement. */
.ticker-content { flex: 1; min-width: 0; color: #ffffff; font-weight: 600; }
.ticker-text { display: block; line-height: 1.35; white-space: normal; overflow-wrap: break-word; }
.ticker-label.alert-warning, .ticker-label.alert-boarding { background: var(--amber); color: var(--navy); border-left-color: #ffffff; }
.ticker-label.alert-cancelled { background: var(--red); color: #ffffff; border-left-color: #ffffff; }
.ticker-label.alert-unavailable { background: #ffffff; color: var(--navy); border-left-color: var(--amber); }
</style>

<script>
'use strict';
// Unattended platform-display settings. Board data refreshes every 30 seconds;
// actual-departure activity checks run every 10 seconds in between.
const CONFIG = {
  maxDepartures: 3,
  refreshIntervalMs: 30000,
  activityIntervalMs: 10000,
  departuresUrl: 'https://api.traini.ac/api/departures/MCV?limit=70',
  activityUrl: 'https://api.traini.ac/api/stations/MCV/activity?limit=100',
  cancellationsUrl: 'https://api.traini.ac/api/cancellations?limit=100',
  cancellationsRefreshMs: 120000,
  alertRotationMs: 14000,
  platformChangeMemoryMs: 5 * 60 * 1000
};

const MOTION = {
  // Move by most of a screen every eight seconds: a three-departure cycle
  // is far easier to follow on a screen nobody is controlling with a mouse.
  verticalPageHoldMs: 7500,
  verticalFirstHoldMs: 4500,
  verticalMoveMs: 1450,
  verticalScreenFraction: 0.78,
  callingPointsPixelsPerSecond: 75,
  callingPointsStartPauseMs: 1800,
  callingPointsEndPauseMs: 2200
};

const boardRows = document.getElementById('board-rows');
const tickerText = document.getElementById('ticker-text');
const tickerLabel = document.getElementById('ticker-label');
let latestServices = [];
let boardIsAvailable = false;
let departuresBusy = false;
let activityBusy = false;
let cancellationsBusy = false;
let cancellationReasons = new Map();
let previousPlatforms = new Map();
let platformChangeAlerts = new Map();
let seenFirstDepartureFeed = false;
let alertQueue = [];
let activeAlertIndex = 0;
let alertFingerprint = '';
const departedTrainIds = new Map();
let stopViewports = [];
const stopStates = new Map();
let lastOverdueDelayedKeys = new Set();
// The main board uses a clock-driven pager rather than a tiny per-frame crawl.
// Unlike requestAnimationFrame-based incremental scrolling, it advances in
// clearly visible steps on Safari and resumes following live-data rerenders.
let verticalMode = 'hold';
let verticalHoldUntil = performance.now() + MOTION.verticalFirstHoldMs;
let verticalTransition = null;
let previousAnimationTime = null;

function updateClock() {
  const now = new Date();
  document.getElementById('live-clock').textContent = now.toLocaleTimeString('en-GB', { hour12: false, timeZone: 'Europe/London' });
  document.getElementById('live-date').textContent = now.toLocaleDateString('en-GB', {
    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'Europe/London'
  });
}

function formatTrainiTime(value) {
  if (value === null || value === undefined || value === '') return '--:--';
  const date = new Date(value);
  if (!Number.isNaN(date.getTime())) return date.toLocaleTimeString('en-GB', {
    hour: '2-digit', minute: '2-digit', timeZone: 'Europe/London'
  });
  return String(value);
}

function epoch(value) {
  const time = Date.parse(value || '');
  return Number.isFinite(time) ? time : Number.POSITIVE_INFINITY;
}

function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[char]));
}

// Local presentation-only station name correction. Does not alter the live feed.
// SFD is Salford Central; SLD is Salford Crescent and must remain unchanged.
function displayStationName(name, crs = '') {
  const rawName = String(name ?? '').trim();
  const code = String(crs ?? '').trim().toUpperCase();
  if (code === 'SFD') return 'SALFORD CENTRAL';
  if (rawName.toUpperCase() === 'SALFORD' && code !== 'SLD') return 'SALFORD CENTRAL';
  return rawName || code;
}

// Local display rule supplied by station staff; never apply it to other destinations.
// Check the current station operating notice before putting these instructions on a live screen.
// Matching CRS codes are a backup in case the API varies the displayed name.
function frontCarriagesNotice(destinationName, destinationCrs = '') {
  const name = String(destinationName ?? '').trim().replace(/\s+/g, ' ').toUpperCase();
  const code = String(destinationCrs ?? '').trim().toUpperCase();
  if (name === 'CLITHEROE' || code === 'CLH') {
    return {
      stops: 'LANGHO, WHALLEY & CLITHEROE',
      rowText: 'For LANGHO, WHALLEY & CLITHEROE, travel in the FRONT 2 CARRIAGES ONLY.'
    };
  }
  if (name === 'HEADBOLT LANE' || code === 'HBL') {
    return {
      stops: 'UPHOLLAND, RAINFORD & HEADBOLT LANE',
      rowText: 'For UPHOLLAND, RAINFORD & HEADBOLT LANE, travel in the FRONT 2 CARRIAGES ONLY.'
    };
  }
  return null;
}

// Prefer Traini's stable status codes; status_text is for the passenger-facing text.
function parseServices(data) {
  const entries = Array.isArray(data?.results) ? data.results : (Array.isArray(data) ? data : []);
  return entries.map(s => {
    const statusCode = String(s.status || '').toLowerCase().trim();
    const initialStatusText = String(s.status_text || '').trim();
    const isDeparted = statusCode === 'departed' || (statusCode === '' && /^departed\b/i.test(initialStatusText));
    const cancelled = statusCode === 'cancelled' || (statusCode === '' && /^cancelled\b/i.test(initialStatusText));
    const isDelayed = statusCode === 'expected_late' || statusCode === 'delayed_no_estimate' ||
      statusCode === 'delayed' || (statusCode === '' &&
      (/^delayed\b/i.test(initialStatusText) ||
       (Number.isFinite(epoch(s.expected_departs)) && Number.isFinite(epoch(s.departs)) &&
        epoch(s.expected_departs) > epoch(s.departs) + 60000)));
    let status = initialStatusText || (cancelled ? 'Cancelled' : isDelayed ? 'Delayed' : 'On time');
    if (isDelayed && status.toLowerCase() === 'expected_late' && s.expected_departs) {
      status = 'Expected ' + formatTrainiTime(s.expected_departs);
    }
    if (!initialStatusText && isDelayed && s.expected_departs) {
      status = 'Expected ' + formatTrainiTime(s.expected_departs);
    }
    const statusClass = cancelled ? 'cancelled' : isDelayed ? 'delayed' : 'on-time';
    const points = Array.isArray(s.calling_points) ? s.calling_points : [];
    const isVictoria = p => String(p.station?.crs || p.crs || '').toUpperCase() === 'MCV' ||
      String(p.station?.name || p.name || '').toLowerCase() === 'manchester victoria';
    const mcvIndex = points.findIndex(isVictoria);
    const onward = mcvIndex >= 0 ? points.slice(mcvIndex + 1) : points.filter(p => !isVictoria(p));
    const stops = onward.map(p => displayStationName(
      p.station?.name || p.name, p.station?.crs || p.crs
    )).filter(Boolean).join(', ');
    const departs = s.departs || null;
    const trainId = s.train_id == null ? '' : String(s.train_id);
    // Calendar date/time is part of the key, so the same service on a later day is distinct.
    const serviceKey = [trainId || s.train_uid || s.headcode || 'service', departs || 'unknown',
      s.destination?.crs || s.destination?.name || 'unknown', s.operator || 'unknown'].join('|');
    return {
      key: serviceKey,
      trainId,
      scheduledMs: epoch(departs),
      time: formatTrainiTime(departs),
      destination: displayStationName(
        s.destination?.name || s.destination_name || 'Unknown',
        s.destination?.crs || s.destination_crs
      ),
      operator: s.operator || 'National Rail',
      frontCarriages: frontCarriagesNotice(
        s.destination?.name || s.destination_name || '',
        s.destination?.crs || s.destination_crs || ''
      ),
      status, statusClass, isDelayed, isDeparted,
      platform: s.platform_withheld === true ? '' : String(s.platform ?? '').trim(),
      stops,
      lateReason: isDelayed ? String(s.late_reason || '').trim() : '',
      notForDisplay: s.not_for_display === true,
      serviceClass: String(s.service_class || '').toLowerCase()
    };
  });
}

// Services advertised as 4, 4A or 4B all belong to Platform 4.
// Match the complete platform field to exclude other platforms.
// Withheld or unallocated platforms are never assumed to depart from this platform.
function isDisplayedPlatform(platform) {
  return /^(?:platform\s*)?4\s*[ab]?$/i.test(String(platform ?? '').trim());
}

// A reported delay only gains top-of-board priority AFTER booked departure time.
// Until then the service retains its normal chronological place in the next three.
function isOverdueDelayedService(service, nowMs = Date.now()) {
  return service.isDelayed && Number.isFinite(service.scheduledMs) && service.scheduledMs < nowMs;
}

function selectDepartures() {
  const nowMs = Date.now();
  return latestServices.filter(s =>
    !s.isDeparted && !s.notForDisplay &&
    (!s.serviceClass || !['freight', 'empty stock', 'trip'].includes(s.serviceClass)) &&
    isDisplayedPlatform(s.platform) &&
    (!s.trainId || !departedTrainIds.has(s.trainId))
  )
  // Choose which services to show from their BOOKED times, not delay estimates.
  .sort((a, b) => a.scheduledMs - b.scheduledMs || a.key.localeCompare(b.key))
  .slice(0, CONFIG.maxDepartures)
  // Only an overdue delayed train rises to the top. Preserve booked order otherwise.
  .sort((a, b) => Number(isOverdueDelayedService(b, nowMs)) - Number(isOverdueDelayedService(a, nowMs)) ||
    a.scheduledMs - b.scheduledMs || a.key.localeCompare(b.key));
}

function emptyMessage(text) {
  boardRows.innerHTML = `<div style="padding:2.5rem;text-align:center;color:var(--text-muted);font-size:20px;font-weight:700">${escapeHTML(text)}</div>`;
  stopViewports = [];
  stopStates.clear();
  boardRows.scrollTop = 0;
}

function renderBoard(services) {
  const oldPosition = boardRows.scrollTop;
  const oldViewportTop = boardRows.getBoundingClientRect().top;
  const oldCards = [...boardRows.querySelectorAll('.service-card')];
  const visibleAnchor = oldCards.find(card => card.getBoundingClientRect().bottom > oldViewportTop + 2);
  const anchorKey = visibleAnchor?.dataset.serviceKey;
  const anchorOffset = visibleAnchor ? visibleAnchor.getBoundingClientRect().top - oldViewportTop : 0;
  const stopPositions = new Map();
  for (const viewport of stopViewports) {
    const key = viewport.closest('.service-card')?.dataset.serviceKey;
    if (key) stopPositions.set(key, viewport.scrollLeft);
  }

  if (!services.length) {
    emptyMessage('No upcoming departures are currently advertised from Platform 4. Please check official station information.');
    lastOverdueDelayedKeys.clear();
    return;
  }

  const overdueKeys = new Set(services.filter(s => isOverdueDelayedService(s)).map(s => s.key));
  const newlyOverdue = [...overdueKeys].some(key => !lastOverdueDelayedKeys.has(key));
  lastOverdueDelayedKeys = overdueKeys;
  const currentKeys = new Set();
  boardRows.replaceChildren();
  for (const dep of services) {
    const card = document.createElement('div');
    card.className = 'service-card';
    card.dataset.serviceKey = dep.key;
    currentKeys.add(dep.key);
    card.innerHTML = `
      <div class="service-main">
        <div class="dep-time">${escapeHTML(dep.time)}</div>
        <div class="dep-dest">${escapeHTML(dep.destination)}</div>
        <div class="dep-operator">${escapeHTML(dep.operator)}</div>
        <div class="dep-status ${dep.statusClass}">${escapeHTML(dep.status)}</div>
        <div class="dep-plat">${escapeHTML(dep.platform || 'TBC')}</div>
      </div>
      ${dep.frontCarriages && dep.statusClass !== 'cancelled' ? `
        <div class="carriage-notice" role="note">
          <span class="carriage-notice-label">BOARDING INFORMATION</span>
          <span class="carriage-notice-copy">${escapeHTML(dep.frontCarriages.rowText)}</span>
        </div>` : ''}
      ${dep.lateReason ? `<div class="service-reason"><span class="label">DELAY REASON:</span>${escapeHTML(dep.lateReason)}</div>` : ''}
      <div class="service-stops">
        <span class="label">Calling at:</span>
        <div class="stops-viewport"><span class="stops-text">${escapeHTML(dep.stops || 'Stopping pattern unavailable')}</span></div>
      </div>
    `;
    boardRows.appendChild(card);
    const viewport = card.querySelector('.stops-viewport');
    if (stopPositions.has(dep.key)) viewport.scrollLeft = stopPositions.get(dep.key);
  }
  stopViewports = [...boardRows.querySelectorAll('.stops-viewport')];
  for (const key of stopStates.keys()) if (!currentKeys.has(key)) stopStates.delete(key);

  if (newlyOverdue) {
    // Only a train which has passed its booked time jumps to the top.
    boardRows.scrollTop = 0;
    verticalMode = 'hold';
    verticalTransition = null;
    verticalHoldUntil = performance.now() + MOTION.verticalFirstHoldMs;
  } else if (anchorKey) {
    const newAnchor = [...boardRows.querySelectorAll('.service-card')]
      .find(card => card.dataset.serviceKey === anchorKey);
    boardRows.scrollTop = oldPosition;
    if (newAnchor) {
      boardRows.scrollTop += newAnchor.getBoundingClientRect().top -
        boardRows.getBoundingClientRect().top - anchorOffset;
    }
  } else {
    boardRows.scrollTop = oldPosition;
  }
}

function updateDisplayedServices() {
  if (boardIsAvailable) {
    renderBoard(selectDepartures());
    updateServiceAlerts();
  }
}

// Check the booked-time boundary every second, independently of the 30s API
// refresh. Re-render exactly once when a reported delay becomes overdue.
function promoteNewlyOverdueServices() {
  if (!boardIsAvailable) return;
  const currentlyShown = selectDepartures();
  const crossedBookedTime = currentlyShown.some(s =>
    isOverdueDelayedService(s) && !lastOverdueDelayedKeys.has(s.key));
  if (crossedBookedTime) updateDisplayedServices();
}

// Keep everything on the passenger screen specific to a currently advertised
// Manchester Victoria service. This avoids showing unrelated national issues.
function recordPlatformChanges(services) {
  const now = Date.now();
  const next = new Map();
  for (const service of services) {
    const platform = String(service.platform || '').trim().toUpperCase();
    const before = previousPlatforms.get(service.key);
    // An initial platform allocation is not a change of an advertised platform.
    if (seenFirstDepartureFeed && before && platform && before !== platform) {
      platformChangeAlerts.set(service.key, {
        reportedAt: now,
        message: `${service.time} to ${service.destination}: platform changed from ${before} to ${platform}.`
      });
    }
    next.set(service.key, platform);
  }
  previousPlatforms = next;
  seenFirstDepartureFeed = true;
  for (const [key, change] of platformChangeAlerts) {
    if (now - change.reportedAt > CONFIG.platformChangeMemoryMs || !next.has(key)) {
      platformChangeAlerts.delete(key);
    }
  }
}

function buildServiceAlerts(services) {
  const items = [];
  const now = Date.now();
  for (const train of services) {
    if (train.statusClass === 'cancelled') {
      // Only join cancellation reasons on the exact train_id; the national feed
      // doesn't contain enough route detail to safely guess any other match.
      const reason = train.trainId ? cancellationReasons.get(train.trainId) : '';
      items.push({
        type: 'cancelled', priority: 0, scheduledMs: train.scheduledMs,
        text: `${train.time} to ${train.destination} is CANCELLED.${reason ? ' Reason: ' + reason : ' Please check station information for alternatives.'}`
      });
      continue;
    }
    const platformChange = platformChangeAlerts.get(train.key);
    if (platformChange && now - platformChange.reportedAt <= CONFIG.platformChangeMemoryMs) {
      items.push({ type: 'warning', priority: 1, scheduledMs: train.scheduledMs,
        text: platformChange.message });
    }
    if (train.frontCarriages) {
      items.push({
        type: 'boarding', priority: 2, scheduledMs: train.scheduledMs,
        text: `${train.time} to ${train.destination}: ${train.frontCarriages.rowText}`
      });
    }
    if (train.isDelayed) {
      const status = /^expected\s/i.test(train.status) ? `now expected ${train.status.replace(/^expected\s*/i,'')}` : 'delayed';
      items.push({
        type: 'warning', priority: 3, scheduledMs: train.scheduledMs,
        text: `${train.time} to ${train.destination} is ${status}.${train.lateReason ? ' Reason: ' + train.lateReason : ''}`
      });
    }
  }
  items.sort((a,b) => a.priority - b.priority || a.scheduledMs - b.scheduledMs);
  if (items.length) return items.slice(0, 10);
  return [{
    type: 'normal', priority: 9, scheduledMs: 0,
    text: 'LIVE SERVICE INFORMATION  •  Please check the destination before boarding and listen for station announcements.'
  }];
}

function showActiveAlert() {
  const alert = alertQueue[activeAlertIndex] || {
    type: 'normal', text: 'Please listen for station announcements.'
  };
  tickerText.textContent = alert.text;
  tickerLabel.textContent = alert.type === 'cancelled' ? 'CANCELLATION' :
    alert.type === 'warning' ? 'SERVICE ALERT' :
    alert.type === 'boarding' ? 'BOARDING INFO' :
    alert.type === 'unavailable' ? 'SERVICE UPDATE' : 'SERVICE UPDATE';
  tickerLabel.classList.toggle('alert-warning', alert.type === 'warning');
  tickerLabel.classList.toggle('alert-boarding', alert.type === 'boarding');
  tickerLabel.classList.toggle('alert-cancelled', alert.type === 'cancelled');
  tickerLabel.classList.toggle('alert-unavailable', alert.type === 'unavailable');
}

function setAlerts(items) {
  const signature = JSON.stringify(items.map(item => [item.type, item.text]));
  if (signature === alertFingerprint) return;  // No flicker during routine refreshes.
  alertFingerprint = signature;
  alertQueue = items;
  activeAlertIndex = 0; // New information takes priority immediately.
  showActiveAlert();
}

function updateServiceAlerts() {
  if (!boardIsAvailable) return;
  setAlerts(buildServiceAlerts(selectDepartures()));
}

function rotateServiceAlert() {
  if (alertQueue.length < 2) return;
  activeAlertIndex = (activeAlertIndex + 1) % alertQueue.length;
  showActiveAlert();
}

// The optional cancellations feed provides reason codes, not station alerts.
// If it fails, the main board continues to show cancellation information.
async function fetchCancellationReasons() {
  if (cancellationsBusy) return;
  cancellationsBusy = true;
  try {
    const response = await fetch(CONFIG.cancellationsUrl, { cache: 'no-store' });
    if (!response.ok) throw new Error('Cancellations feed HTTP ' + response.status);
    const json = await response.json();
    if (!Array.isArray(json.results)) throw new Error('Unexpected cancellation data');
    const next = new Map();
    for (const entry of json.results) {
      if (!entry.train_id || !entry.reason) continue;
      next.set(String(entry.train_id), String(entry.reason).trim());
    }
    cancellationReasons = next;
    updateServiceAlerts();
  } catch (error) {
    console.warn('Additional cancellation reasons unavailable:', error);
  } finally {
    cancellationsBusy = false;
  }
}

async function fetchDepartures() {
  if (departuresBusy) return;
  departuresBusy = true;
  try {
    const response = await fetch(CONFIG.departuresUrl, { cache: 'no-store' });
    if (!response.ok) throw new Error('Departure feed HTTP ' + response.status);
    const json = await response.json();
    if (!Array.isArray(json.results)) throw new Error('Unexpected departure data');
    latestServices = parseServices(json);
    boardIsAvailable = true;
    recordPlatformChanges(latestServices);
    updateDisplayedServices();
  } catch (error) {
    console.warn('Departure feed unavailable:', error);
    boardIsAvailable = false;
    latestServices = [];
    // Never substitute invented train times on a public/platform display.
    emptyMessage('Live departure information is temporarily unavailable. Please check station screens.');
    setAlerts([{ type: 'unavailable', text: 'LIVE DEPARTURE INFORMATION UNAVAILABLE — Please refer to official station information.' }]);
  } finally {
    departuresBusy = false;
  }
}

async function fetchDepartureActivity() {
  if (activityBusy) return;
  activityBusy = true;
  try {
    const response = await fetch(CONFIG.activityUrl, { cache: 'no-store' });
    if (!response.ok) throw new Error('Activity feed HTTP ' + response.status);
    const json = await response.json();
    if (!Array.isArray(json.results)) throw new Error('Unexpected activity data');
    let newDeparture = false;
    for (const event of json.results) {
      if (String(event.event_type || '').toUpperCase() !== 'DEPARTURE' || !event.train_id) continue;
      const id = String(event.train_id);
      if (!departedTrainIds.has(id)) {
        departedTrainIds.set(id, Date.now());
        if (latestServices.some(service => service.trainId === id)) newDeparture = true;
      }
    }
    // Keep memory bounded; train IDs are day-specific, only recent events matter.
    for (const [id, firstSeen] of departedTrainIds) {
      if (Date.now() - firstSeen > 5 * 60 * 60 * 1000) departedTrainIds.delete(id);
    }
    if (newDeparture) updateDisplayedServices();
  } catch (error) {
    // Normal board refresh still removes entries marked departed by the main feed.
    console.warn('Departure activity unavailable:', error);
  } finally {
    activityBusy = false;
  }
}

// Advance by around one screen every few seconds, then show the bottom page
// fully before returning to the first departure. This runs on a timer, not
// Safari's frame rate, and always reaches the final departure of the three.
function advanceBoardScroll() {
  const now = performance.now();
  const bottom = Math.max(0, boardRows.scrollHeight - boardRows.clientHeight);
  if (!boardIsAvailable || bottom <= 1) {
    if (verticalMode !== 'hold' || verticalTransition) {
      verticalTransition = null;
      verticalMode = 'hold';
      verticalHoldUntil = now + MOTION.verticalFirstHoldMs;
    }
    return;
  }

  if (verticalMode === 'moving') {
    const move = verticalTransition;
    if (!move) { verticalMode = 'hold'; return; }
    const fraction = Math.min(1, (now - move.startedAt) / MOTION.verticalMoveMs);
    const eased = fraction < .5 ? 2 * fraction * fraction : 1 - Math.pow(-2 * fraction + 2, 2) / 2;
    boardRows.scrollTop = Math.max(0, Math.min(bottom, move.from + (move.to - move.from) * eased));
    if (fraction >= 1) {
      boardRows.scrollTop = Math.max(0, Math.min(bottom, move.to));
      verticalTransition = null;
      verticalMode = 'hold';
      verticalHoldUntil = now + MOTION.verticalPageHoldMs;
    }
    return;
  }

  if (now < verticalHoldUntil) return;
  const current = Math.max(0, Math.min(bottom, boardRows.scrollTop));
  const step = Math.max(120, Math.floor(boardRows.clientHeight * MOTION.verticalScreenFraction));
  // A full top-to-bottom cycle, rather than stopping after the first viewport.
  const next = current >= bottom - 2 ? 0 : Math.min(bottom, current + step);
  verticalTransition = { from: current, to: next, startedAt: now };
  verticalMode = 'moving';
}

// Smooth long calling-point strips only when those particular strips overflow.
function autoScrollFrame(now) {
  const elapsed = previousAnimationTime === null ? 0 : Math.min((now - previousAnimationTime) / 1000, 0.1);
  previousAnimationTime = now;

  // A stopping pattern moves ONLY when it overflows its available width.
  // Hidden rows pause; when they reappear, their horizontal progress resumes.
  const visibleArea = boardRows.getBoundingClientRect();
  for (const viewport of stopViewports) {
    const excess = viewport.scrollWidth - viewport.clientWidth;
    if (excess <= 1) { viewport.scrollLeft = 0; continue; }
    const card = viewport.closest('.service-card');
    const rect = card.getBoundingClientRect();
    if (rect.bottom <= visibleArea.top || rect.top >= visibleArea.bottom) continue;
    const key = card.dataset.serviceKey;
    let state = stopStates.get(key);
    if (!state) {
      state = { phase: 'start', waitUntil: now + MOTION.callingPointsStartPauseMs };
      stopStates.set(key, state);
    }
    if (now < state.waitUntil) continue;
    if (state.phase === 'start') state.phase = 'moving';
    if (state.phase === 'moving') {
      viewport.scrollLeft = Math.min(excess, viewport.scrollLeft + MOTION.callingPointsPixelsPerSecond * elapsed);
      if (viewport.scrollLeft >= excess - 1) {
        viewport.scrollLeft = excess;
        state.phase = 'end';
        state.waitUntil = now + MOTION.callingPointsEndPauseMs;
      }
    } else if (state.phase === 'end') {
      viewport.scrollLeft = 0;
      state.phase = 'start';
      state.waitUntil = now + MOTION.callingPointsStartPauseMs;
    }
  }
  requestAnimationFrame(autoScrollFrame);
}

updateClock();
setInterval(updateClock, 1000);
fetchDepartures();
fetchDepartureActivity();
fetchCancellationReasons();
setInterval(fetchDepartures, CONFIG.refreshIntervalMs);
setInterval(promoteNewlyOverdueServices, 1000);
setInterval(fetchDepartureActivity, CONFIG.activityIntervalMs);
setInterval(fetchCancellationReasons, CONFIG.cancellationsRefreshMs);
setInterval(rotateServiceAlert, CONFIG.alertRotationMs);
setInterval(advanceBoardScroll, 40);
requestAnimationFrame(autoScrollFrame);
</script>

</body>
</html>
