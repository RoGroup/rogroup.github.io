<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manchester Victoria | Northern Live Departures</title>
<style>
@font-face {
  font-family: "Bunday Clean";
  src: url("bunday-clean-regular.woff") format("woff");
  font-weight: 400 600;
  font-style: normal;
}

@font-face {
  font-family: "Bunday Clean";
  src: url("bunday-clean-bold.woff") format("woff");
  font-weight: 700 900;
  font-style: normal;
}

:root {
  --navy:#262262;
  --blue:#0698d6;
  --bg:#f2f4f7;
  --panel:#ffffff;
  --line:#e1e5ec;
  --ink:#262262;
  --muted:#667085;
  --white:#ffffff;
  --green:#168653;
  --red:#c83c4b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bunday Clean", Arial, Helvetica, sans-serif}
header{
  background:#fff;
  border-bottom:1px solid #e4e7ed;
  padding:18px 4%;
  display:flex;justify-content:space-between;align-items:center;gap:20px;
  box-shadow:0 2px 10px rgba(38,34,98,.045)
}
.brand{display:flex;align-items:center;gap:26px;min-width:0}
.logo{width:190px;height:76px;object-fit:contain;display:block}
.station{border-left:1px solid #d9dce6;padding-left:24px}
h1{margin:0;color:var(--navy);font-size:clamp(23px,4vw,36px);line-height:1.1;font-weight:750;font-family:"Bunday Clean", Arial, Helvetica, sans-serif}
.subtitle{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:2.5px;margin-top:8px}
.clock{color:var(--navy);font-size:26px;font-weight:750;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-family:"Bunday Clean", Arial, Helvetica, sans-serif}
.clock small{display:block;color:var(--muted);font-size:11px;margin-top:5px;font-weight:500}
main{max-width:1500px;margin:auto;padding:27px 4%}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}
.heading{font-size:21px;font-weight:750;color:var(--navy);font-family:"Bunday Clean", Arial, Helvetica, sans-serif}
.live{color:var(--green);font-size:12px;margin-top:7px;font-weight:650}
.live:before{content:"";display:inline-block;width:8px;height:8px;background:var(--green);border-radius:50%;margin-right:8px;box-shadow:0 0 0 3px rgba(22,134,83,.12)}
button{background:var(--navy);color:#fff;border:0;border-radius:4px;padding:12px 17px;font-weight:700;font-family:"Bunday Clean", Arial, Helvetica, sans-serif;cursor:pointer;transition:background .15s ease}
button:hover{background:#36318a}
button:disabled{opacity:.55;cursor:wait}
.filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
input{background:#fff;border:1px solid #d4d9e3;color:var(--navy);padding:12px 14px;border-radius:4px;font-size:14px;flex:1;min-width:180px;outline:none;font-family:"Bunday Clean", Arial, Helvetica, sans-serif}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(6,152,214,.12)}
input::placeholder{color:#8791a2}
.board{background:var(--navy);border:1px solid #1e1a50;border-radius:6px;overflow:hidden;box-shadow:0 8px 24px rgba(38,34,98,.10)}
.labels,.service{display:grid;grid-template-columns:90px minmax(150px,1fr) 90px 115px 160px 35px;align-items:center;gap:12px;padding:16px 20px}
.labels{background:#1d1a50;color:#aeb8d6;font-size:10px;letter-spacing:1.1px;text-transform:uppercase;font-weight:750;font-family:"Bunday Clean", Arial, Helvetica, sans-serif}
.service{min-height:82px;border-top:1px solid rgba(255,255,255,.11);cursor:pointer;color:#fff;transition:background .15s ease}
.service:hover{background:#302b77}
.time{color:#fff;font-size:22px;font-weight:750;font-variant-numeric:tabular-nums;font-family:"Bunday Clean", Arial, Helvetica, sans-serif}
.destination{font-size:17px;font-weight:750;color:#fff;font-family:"Bunday Clean", Arial, Helvetica, sans-serif}
.operator{color:#bdc4db;font-size:12px;margin-top:6px}
.platform{background:rgba(6,152,214,.16);color:#79d5ff;border:1px solid rgba(6,152,214,.38);border-radius:4px;padding:8px;text-align:center;font-weight:750;font-family:"Bunday Clean", Arial, Helvetica, sans-serif}
.status{color:#8fe0b5;font-size:12px;font-weight:700;font-family:"Bunday Clean", Arial, Helvetica, sans-serif}
.delayed,.cancelled{color:#ff9ca5}.early{color:#8fe0b5}.boarding{color:#79d5ff}
.expand{color:#79d5ff;font-size:20px;text-align:center}
.route{display:none;background:#1d1a50;border-top:1px solid rgba(255,255,255,.12);padding:23px 30px 28px;color:#fff}
.route.open{display:block}
.route-title{color:#79d5ff;font-size:11px;letter-spacing:1.2px;font-weight:800;margin-bottom:20px;font-family:"Bunday Clean", Arial, Helvetica, sans-serif}
.stop{display:grid;grid-template-columns:22px 85px minmax(0,1fr) 85px;gap:12px;min-height:53px;position:relative;align-items:start}
.stop:not(:last-child):before{content:"";position:absolute;left:8px;top:14px;height:calc(100% + 1px);width:2px;background:#5d5a91}
.dot{width:18px;height:18px;border-radius:50%;border:3px solid var(--blue);background:#1d1a50;z-index:1}
.destination-stop .dot{background:var(--blue)}
.stop-name{font-weight:700;font-size:14px;color:#fff;font-family:"Bunday Clean", Arial, Helvetica, sans-serif}
.stop-time{color:#79d5ff;font-size:13px;font-variant-numeric:tabular-nums;font-family:"Bunday Clean", Arial, Helvetica, sans-serif}
.stop-platform{color:#bdc4db;font-size:12px;text-align:right}
.stop-sub{color:#aeb8d6;font-size:11px;margin-top:4px}
.route-error,.empty{padding:35px;text-align:center;color:#c5cbe0}
.footer{display:flex;justify-content:space-between;color:#747d90;font-size:12px;padding:16px 3px}
@media(max-width:700px){
 header{padding:15px 4%}.brand{gap:14px}.logo{width:112px;height:55px}.station{padding-left:14px}
 .subtitle{letter-spacing:1.5px;font-size:10px}.clock{font-size:19px}
 .labels{display:none}
 .service{grid-template-columns:65px 1fr 60px 25px;padding:15px 12px;gap:8px}
 .time{font-size:19px}.destination{font-size:15px}.platform{font-size:12px;padding:8px 3px}
 .service .expected{display:none}.status{grid-column:2/4}.expand{grid-column:4;grid-row:1}
 .route{padding:19px 12px}.stop{grid-template-columns:20px 70px 1fr 55px;gap:7px}
 .stop-name{font-size:12px}.stop-time,.stop-platform{font-size:11px}
 .footer{flex-direction:column;gap:8px}
}
</style>
</head>

    <div class="station">
      <h1>Manchester Victoria</h1>
      <div class="subtitle">LIVE DEPARTURES</div>
    </div>
  </div>
  <div class="clock"><span id="clock">--:--:--</span><small id="date"></small></div>
</header>
<main>
  <div class="toolbar">
    <div><div class="heading">Departures</div><div class="live" id="connection">CONNECTING</div></div>
    <button id="refresh" onclick="loadBoard()">↻ Refresh</button>
  </div>
  <div class="filters">
    <input id="stationFilter" placeholder="Filter by calling point, e.g. Leeds" onkeydown="if(event.key==='Enter')loadBoard()">
    <button onclick="loadBoard()">Search</button>
    <button onclick="clearFilter()" style="background:#31496b;color:white">Clear</button>
  </div>
  <div class="board">
    <div class="labels"><div>Time</div><div>Destination</div><div>Platform</div><div>Expected</div><div>Status</div><div></div></div>
    <div id="services"><div class="empty">Loading live departures…</div></div>
  </div>
  <div class="footer"><span id="updated">Waiting for data…</span><span>Live railway data • Auto refresh every 30 seconds</span></div>
</main>
<script>
const API = "https://api.traini.ac/api/departures/MCV";
let services = [];
let expanded = new Set();
let loading = false;

function escapeHTML(value) {
  return String(value ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;")
    .replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
function formatTime(value) {
  if (!value) return "--:--";
  const d = new Date(value);
  if (!isNaN(d)) return d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",timeZone:"Europe/London"});
  return String(value);
}
function getStatus(t) {
  if (t.status_text) return t.status_text;
  if (t.status === "cancelled") return "CANCELLED";
  return "On time";
}
function getCallingPoints(t) {
  const points = t.calling_points || [];
  const victoria = points.findIndex(p => {
    const name = (p.station?.name || p.name || "").toLowerCase();
    const crs = (p.station?.crs || "").toUpperCase();
    return name === "manchester victoria" || crs === "MCV";
  });
  return victoria >= 0 ? points.slice(victoria + 1) : points.filter(p => {
    const name = (p.station?.name || p.name || "").toLowerCase();
    const crs = (p.station?.crs || "").toUpperCase();
    return name !== "manchester victoria" && crs !== "MCV";
  });
}
function routeHTML(t) {
  const points = getCallingPoints(t);
  if (!points.length) return '<div class="route-error">No downstream calling points are available for this service.</div>';
  return `<div class="route-title">CALLING AT AFTER MANCHESTER VICTORIA <span style="color:var(--muted);font-weight:normal">• ${points.length} stops</span></div>` +
    points.map((p,i) => {
      const name = p.station?.name || p.name || "Unknown station";
      const scheduled = p.scheduled || p.arrival || p.departure || p.arrival_time || p.departure_time;
      const expected = p.expected || p.expected_arrival;
      const last = i === points.length - 1;
      return `<div class="stop ${last?"destination-stop":""}">
        <div class="dot"></div><div class="stop-time">${formatTime(expected || scheduled)}
        ${expected && scheduled && expected !== scheduled ? `<div class="stop-sub">Booked ${formatTime(scheduled)}</div>` : ""}</div>
        <div><div class="stop-name">${escapeHTML(name)}</div><div class="stop-sub">${last?"Final calling point":"Calling point"}</div></div>
        <div class="stop-platform">${p.platform ? "Platform "+escapeHTML(p.platform) : ""}</div>
      </div>`;
    }).join("");
}
function render() {
  const filter = document.getElementById("stationFilter").value.trim().toLowerCase();
  const visible = services.filter(t => !filter || getCallingPoints(t).some(p => {
    const name = (p.station?.name || p.name || "").toLowerCase();
    const crs = (p.station?.crs || "").toLowerCase();
    return name.includes(filter) || crs === filter;
  }));
  const root = document.getElementById("services");
  if (!visible.length) { root.innerHTML = '<div class="empty">No matching services found.</div>'; return; }
  root.innerHTML = visible.map((t,i) => {
    const id = String(t.train_id || t.train_uid || t.headcode || i);
    const open = expanded.has(id), cancelled = t.status === "cancelled";
    const cls = cancelled ? "cancelled" : t.status === "expected_late" ? "delayed" :
      t.status === "expected_early" ? "early" : t.status === "boarding" ? "boarding" : "";
    return `<div class="service" data-id="${escapeHTML(id)}">
      <div class="time">${formatTime(t.departs)}</div>
      <div><div class="destination">${escapeHTML(t.destination?.name || "Unknown")}</div>
      <div class="operator">${escapeHTML(t.operator || "National Rail")}${t.headcode ? " • "+escapeHTML(t.headcode) : ""}</div></div>
      <div class="platform">${t.platform_withheld ? "TBC" : escapeHTML(t.platform || "TBC")}</div>
      <div class="time expected" style="font-size:17px">${cancelled ? "—" : formatTime(t.expected_departs || t.departs)}</div>
      <div class="status ${cls}">${escapeHTML(getStatus(t))}</div><div class="expand">${open?"−":"+"}</div>
    </div><div class="route ${open?"open":""}">${open?routeHTML(t):""}</div>`;
  }).join("");
  document.querySelectorAll(".service").forEach(row => row.addEventListener("click",() => {
    const id = row.dataset.id;
    if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
    render();
  }));
}
async function loadBoard() {
  if (loading) return;
  loading = true;
  const button = document.getElementById("refresh");
  const connection = document.getElementById("connection");
  button.disabled = true; connection.textContent = "UPDATING";
  try {
    const filter = document.getElementById("stationFilter").value.trim();
    const params = new URLSearchParams({limit:"50"});
    if (filter) params.set("calling_at",filter);
    const response = await fetch(`${API}?${params}`,{cache:"no-store"});
    const data = await response.json();
    if (!response.ok) throw new Error(data.message || data.error || `HTTP ${response.status}`);
    console.log("API response:",data);
    services = data.results || [];
    render();
    connection.textContent = "LIVE DATA CONNECTED";
    document.getElementById("updated").textContent = "Last updated: " +
      new Date().toLocaleTimeString("en-GB",{timeZone:"Europe/London"});
  } catch(e) {
    console.error(e); connection.textContent = "CONNECTION ERROR";
    document.getElementById("services").innerHTML =
      `<div class="empty" style="color:var(--red)">Unable to retrieve live departures.<br><br>${escapeHTML(e.message)}</div>`;
  } finally { loading = false; button.disabled = false; }
}
function clearFilter() { document.getElementById("stationFilter").value = ""; loadBoard(); }
function updateClock() {
  const now = new Date();
  document.getElementById("clock").textContent = now.toLocaleTimeString("en-GB",{timeZone:"Europe/London"});
  document.getElementById("date").textContent = now.toLocaleDateString("en-GB",{timeZone:"Europe/London",weekday:"long",day:"numeric",month:"long"});
}
updateClock(); loadBoard(); setInterval(updateClock,1000); setInterval(loadBoard,30000);
</script>
</body>
</html>
